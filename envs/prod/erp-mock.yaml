# prod values for erp-mock (shared chart o2c-infra/helm/o2c-service >= 0.4.0, ADR-017).
# image.repository and image.digest are set by o2c-app's release workflow in dev
# (ADR-016) and copied to test and prod by a promotion PR.
# Credentials: Secret erp-mock-secrets (o2c-infra platform/kind/secrets.sh), never in Git.
# prod runs 0 replicas until a release is promoted to it (manual sync).
# The image's CMD runs the Alembic migrations, then the API
image:
  repository: ghcr.io/abhinavsingh-a1/o2c-erp-mock
  digest: "sha256:3afa50cf4fb32dca1bc3b7f0a4c7870786f92f8b90ffd5d4651a17235e85e6c5"
replicaCount: 1
o2cEnv: prod
containerPort: 8100
healthPath: /health
# Keys: ERP_DATABASE_URL
secretName: erp-mock-secrets
# No Kafka client; set like every service so the environment is uniform
env:
  KAFKA_ADDRESS_FAMILY: "v4"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi
