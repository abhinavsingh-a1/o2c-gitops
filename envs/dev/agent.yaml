# Dev values for agent (shared chart o2c-infra/helm/o2c-service >= 0.3.0).
# image.repository and image.digest are set by o2c-app's release workflow (ADR-016):
# the pod runs repository@digest; the digest stays empty until the first release.
# Secrets are referenced by name only; the Secret agent-secrets is created outside Git.
# The anomaly model is baked into the image (/app/models/o2c-quantity-anomaly):
# no MLFLOW_TRACKING_URI needed. erp-mock is reached through its Service (port 80).
# Open: reviewer accounts (AUTH_USERS_FILE) need a mounted file; the chart has no volumes yet.
image:
  repository: ghcr.io/abhinavsingh-a1/o2c-agent
  digest: ""
containerPort: 8400
healthPath: /health
command:
  - "uvicorn"
  - "agent.app:create_app"
  - "--factory"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8400"
env:
  KAFKA_BOOTSTRAP: "kafka:9092"
  S3_ENDPOINT_URL: "http://s3:8333"
  LITELLM_BASE_URL: "http://litellm:4000"
  ERP_BASE_URL: "http://erp-mock"
# Keys: LITELLM_MASTER_KEY (its own virtual key), EVENTS_DATABASE_URL, S3_ACCESS_KEY, S3_SECRET_KEY,
# AUTH_JWT_SECRET
secretName: agent-secrets
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
