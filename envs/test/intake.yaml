# test values for intake (shared chart o2c-infra/helm/o2c-service >= 0.4.0, ADR-017).
# image.repository and image.digest are set by o2c-app's release workflow in dev
# (ADR-016) and copied to test and prod by a promotion PR.
# Credentials: Secret intake-secrets (o2c-infra platform/kind/secrets.sh), never in Git.
# test runs 0 replicas until a release is promoted to it (manual sync).
# gunicorn with 2 workers; metrics in multiprocess mode under /tmp (ADR-012)
image:
  repository: ghcr.io/abhinavsingh-a1/o2c-intake
  digest: "sha256:50ac5e98a79752b94c98fc44357aa9c5433407750cd4118110b8f5188cfd9dca"
replicaCount: 0
o2cEnv: test
containerPort: 8200
healthPath: /health
command:
  - "gunicorn"
  - "-c"
  - "python:intake.gunicorn_conf"
  - "intake.app:create_app()"
# Infrastructure runs in Docker Compose on the host (host.docker.internal)
env:
  KAFKA_BOOTSTRAP: "host.docker.internal:29092"
  S3_ENDPOINT_URL: "http://host.docker.internal:8333"
  PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus-intake"
# Keys: INTAKE_HMAC_SECRET, S3_ACCESS_KEY, S3_SECRET_KEY
secretName: intake-secrets
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
