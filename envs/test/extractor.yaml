# test values for extractor (shared chart o2c-infra/helm/o2c-service >= 0.4.0, ADR-017).
# image.repository and image.digest are set by o2c-app's release workflow in dev
# (ADR-016) and copied to test and prod by a promotion PR.
# Credentials: Secret extractor-secrets (o2c-infra platform/kind/secrets.sh), never in Git.
# test runs 0 replicas until a release is promoted to it (manual sync).
image:
  repository: ghcr.io/abhinavsingh-a1/o2c-extractor
  digest: "sha256:f7d967928000e7a95d919d98f9f10440f3c3e2d7240143beb00dcc1ac16d1fd3"
replicaCount: 0
o2cEnv: test
containerPort: 8300
healthPath: /health
command:
  - "uvicorn"
  - "extractor.app:create_app"
  - "--factory"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8300"
# Infrastructure runs in Docker Compose on the host (host.docker.internal)
env:
  KAFKA_BOOTSTRAP: "host.docker.internal:29092"
  S3_ENDPOINT_URL: "http://host.docker.internal:8333"
  LITELLM_BASE_URL: "http://host.docker.internal:4000"
# Keys: LITELLM_MASTER_KEY (its own virtual key), EVENTS_DATABASE_URL, S3_ACCESS_KEY,
# S3_SECRET_KEY
secretName: extractor-secrets
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
