# The root Application (app of apps, o2c-app ADR-017), applied once by o2c-infra
# platform/kind/bootstrap.sh. Everything else comes from platform/argocd/apps in Git:
# the AppProjects, the namespaces, the Kyverno policies and the ApplicationSet with one
# Application per service and environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: o2c-root
  namespace: argocd
  finalizers:
    # Deleting the root deletes its children first, then their resources
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/abhinavsingh-a1/o2c-gitops.git
    targetRevision: main
    path: platform/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
